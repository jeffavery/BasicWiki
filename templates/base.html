<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <title>{% block title %}BasicWiki{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='image-uploads-1') }}">
    <link rel="icon" href="{{ url_for('static', filename="favicon.ico") }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename="favicon-32.png") }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename="apple-touch-icon.png") }}">
</head>
<body>
<header class="topbar">
    <div class="shell topbar-inner">
        <a class="brand" href="{{ url_for('home') }}">
            <img class="brand-logo brand-logo-light" src="{{ url_for('static', filename='basicwiki-logo.png', v='horizontal') }}" alt="BasicWiki" width="2168" height="725">
            <img class="brand-logo brand-logo-dark" src="{{ url_for('static', filename='basicwiki-logo-dark.png', v='horizontal') }}" alt="BasicWiki" width="2168" height="725">
        </a>
        <form class="search-form" action="{{ url_for('search') }}" method="get">
            <input type="search" name="q" value="{{ request.args.get('q','') }}" placeholder="Search the wiki">
            <button type="submit">Search</button>
        </form>
        <div class="topbar-actions">
            <button class="button" id="theme-toggle" type="button"
                    aria-label="Toggle dark mode" aria-pressed="false">
                Dark mode
            </button>
            <a class="button primary" href="{{ url_for('new_page') }}">New Page</a>
        </div>
    </div>
</header>

<main class="shell">
    {% block content %}{% endblock %}
</main>

<footer class="shell footer">
    BasicWiki · Your content stays in <code>./data/</code>
</footer>

<script src="{{ url_for('static', filename='copy-code-v2.js') }}"></script>

{% block scripts %}{% endblock %}
</body>
</html>
